# Railway deployment configuration for XPS Shadow Scraper
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "nixpacks"

# ─── Backend Service ─────────────────────────────────────────────────────────
[[services]]
name = "backend"
source = "backend"

[services.build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build"

[services.deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[services.variables]
PORT = "3001"
NODE_ENV = "production"

# ─── Frontend Service ─────────────────────────────────────────────────────────
[[services]]
name = "frontend"
source = "frontend"

[services.build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build"

[services.deploy]
startCommand = "npx serve -s dist -l 3000"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[services.variables]
PORT = "3000"
NODE_ENV = "production"
