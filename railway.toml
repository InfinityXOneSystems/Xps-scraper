# Railway deployment configuration for XPS Shadow Scraper + Integration Stack
# Docs: https://docs.railway.app/reference/config-as-code
#
# Railway Add-ons (provision via Railway dashboard or CLI):
#   railway add --plugin postgresql   → sets DATABASE_URL automatically
#   railway add --plugin redis        → sets REDIS_URL automatically
#
# After provisioning, set the following environment variables in Railway:
#   GROQ_API_KEY                    — Groq Cloud API key (primary LLM)
#   FIRECRAWL_API_KEY               — Firecrawl API key
#   SUPABASE_URL, SUPABASE_ANON_KEY — Supabase (optional)
#   STEEL_API_KEY                   — Steel Browser (optional)
#   GITHUB_APP_ID                   — XPS GitHub App ID
#   GITHUB_APP_PRIVATE_KEY          — XPS GitHub App private key
#   GITHUB_APP_INSTALLATION_ID      — XPS GitHub App installation ID
#   API_KEY, JWT_SECRET             — Backend auth (production)
#
# Full-stack template services (deployed separately after cloning templates):
#   open-claw         → Railway service from templates/open-claw
#   open-deep-research → Railway service from templates/open-deep-research

[build]
builder = "nixpacks"

# ─── Backend Service ─────────────────────────────────────────────────────────
[[services]]
name = "backend"
source = "backend"

[services.build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build"

[services.deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[services.variables]
PORT = "3001"
NODE_ENV = "production"
LLM_API_URL = "https://api.groq.com/openai/v1"
LLM_MODEL = "llama-3.3-70b-versatile"
# DATABASE_URL is auto-injected by Railway Postgres add-on
# REDIS_URL is auto-injected by Railway Redis add-on
# GROQ_API_KEY — set in Railway dashboard
# FIRECRAWL_API_KEY — set in Railway dashboard
# API_KEY — set in Railway dashboard (production auth)
# JWT_SECRET — set in Railway dashboard

# ─── Frontend Service ─────────────────────────────────────────────────────────
[[services]]
name = "frontend"
source = "frontend"

[services.build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build"

[services.deploy]
startCommand = "npx serve -s dist -l 3000"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[services.variables]
PORT = "3000"
NODE_ENV = "production"
