name: Full-Stack Integration CI

# =============================================================================
# XPS Shadow Scraper — Full-Stack Integration Workflow
#
# Runs on every push and PR.
# Steps:
#   1. Clone all open-source template repositories
#   2. Install dependencies (backend, frontend, root)
#   3. Build backend (TypeScript) + run Jest unit tests
#   4. Build frontend (Vite)
#   5. Run Playwright E2E tests (full pipeline: crawl → scrape → harvest → chat)
#   6. Upload test artifacts (screenshots, videos, reports)
#   7. Deploy to Railway (main branch only)
#
# Required Secrets:
#   RAILWAY_TOKEN             — Railway.app API token
#   VITE_API_URL              — Frontend API base URL (production)
#   GITHUB_APP_ID             — XPS GitHub App ID
#   GITHUB_APP_PRIVATE_KEY    — XPS GitHub App private key (PEM)
#   GITHUB_APP_INSTALLATION_ID — XPS GitHub App installation ID
#   GROQ_API_KEY              — Groq Cloud API key (for E2E LLM tests)
#   FIRECRAWL_API_KEY         — Firecrawl API key
# =============================================================================

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      run_e2e:
        description: "Run Playwright E2E tests"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  NODE_VERSION: "20"
  # ── Auth for XPS GitHub App ──────────────────────────────────────────────────
  GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
  GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
  GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}

jobs:
  # ─── 1. Authenticate via XPS GitHub App ────────────────────────────────────
  app-auth:
    name: Authenticate XPS GitHub App
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITHUB_APP_ID }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        continue-on-error: true

  # ─── 2. Clone Templates ────────────────────────────────────────────────────
  clone-templates:
    name: Clone Open-Source Templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: app-auth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ needs.app-auth.outputs.token || github.token }}

      - name: Clone Firecrawl
        run: |
          git clone --depth 1 https://github.com/mendableai/firecrawl.git templates/firecrawl 2>/dev/null \
            || echo "firecrawl: clone failed (network), skipping"

      - name: Clone Firecrawl MCP
        run: |
          git clone --depth 1 https://github.com/mendableai/mcp-server-firecrawl.git templates/firecrawl-mcp 2>/dev/null \
            || echo "firecrawl-mcp: clone failed, skipping"

      - name: Clone Open Lovable
        run: |
          git clone --depth 1 https://github.com/mendableai/open-lovable.git templates/open-lovable 2>/dev/null \
            || echo "open-lovable: clone failed, skipping"

      - name: Clone Open Agent Builder
        run: |
          git clone --depth 1 https://github.com/mendableai/open-agent-builder.git templates/open-agent-builder 2>/dev/null \
            || echo "open-agent-builder: clone failed, skipping"

      - name: Clone Open Claw
        run: |
          git clone --depth 1 https://github.com/mendableai/open-claw.git templates/open-claw 2>/dev/null \
            || echo "open-claw: clone failed, skipping"

      - name: Clone Open Deep Research
        run: |
          git clone --depth 1 https://github.com/mendableai/open-deep-research.git templates/open-deep-research 2>/dev/null \
            || echo "open-deep-research: clone failed, skipping"

      - name: List cloned templates
        run: |
          echo "## 📦 Cloned Templates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for dir in templates/*/; do
            name=$(basename "$dir")
            if [[ -f "${dir}/package.json" ]]; then
              status="✅ cloned"
            elif [[ -d "$dir" ]]; then
              status="⚠️ directory only (no package.json)"
            else
              status="❌ missing"
            fi
            echo "| ${name} | ${status} |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Cache templates
        uses: actions/cache/save@v4
        with:
          path: templates/
          key: templates-${{ github.sha }}

  # ─── 3. Test & Build Backend ────────────────────────────────────────────────
  test-backend:
    name: Test & Build Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 1

  # ─── 4. Build Frontend ─────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}
          VITE_APP_TITLE: XPS Shadow Scraper

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─── 5. Playwright E2E Tests ────────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test-backend, build-frontend]
    if: ${{ github.event.inputs.run_e2e != 'false' }}
    env:
      NODE_ENV: test
      # Allow all requests in dev (no auth key required)
      API_KEY: ""
      JWT_SECRET: ""
      LLM_API_URL: https://api.groq.com/openai/v1
      LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_MODEL: llama-3.3-70b-versatile
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create screenshots directory
        run: mkdir -p tests/e2e/screenshots

      - name: Start backend (background)
        run: |
          cd backend && npm run build && node dist/index.js &
          # Wait for backend to be healthy
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health; then
              echo "Backend healthy"
              break
            fi
            sleep 1
          done
        env:
          PORT: 3001
          FRONTEND_URL: http://localhost:3000
          DATABASE_URL: ""
          REDIS_URL: ""
          NODE_ENV: development
          # Raise the rate-limit ceiling so E2E tests never hit 429 in CI
          RATE_LIMIT_MAX: "10000"
          RATE_LIMIT_WINDOW_MS: "900000"

      - name: Start frontend (background)
        run: |
          cd frontend && VITE_API_URL=http://localhost:3001/api npm run dev &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000; then
              echo "Frontend healthy"
              break
            fi
            sleep 1
          done

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            tests/e2e/screenshots/
          retention-days: 14

      - name: Post E2E summary
        if: always()
        run: |
          echo "## 🎭 Playwright E2E Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ -f playwright-report/results.json ]]; then
            passed=$(jq '.stats.expected // 0' playwright-report/results.json 2>/dev/null || echo "?")
            failed=$(jq '.stats.unexpected // 0' playwright-report/results.json 2>/dev/null || echo "?")
            echo "| Passed | Failed |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| ${passed} | ${failed} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Report file not found — check artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ─── 6. Deploy to Railway ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
    needs: [test-backend, build-frontend, e2e-tests]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App token (for Railway auth + deploy audit)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITHUB_APP_ID }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend
        run: railway up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Frontend
        run: railway up --service frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Post deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service  | Status | Environment |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | ✅ Deployed | ${{ github.event.inputs.environment || 'production' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ✅ Deployed | ${{ github.event.inputs.environment || 'production' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Railway Dashboard](https://railway.app)" >> $GITHUB_STEP_SUMMARY
          echo "📦 Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
